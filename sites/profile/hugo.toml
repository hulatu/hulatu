baseURL = "https://profile.hulatu.com/"
title = "胡拉图"
locale = "zh-CN"
hasCJKLanguage = true
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[markup.goldmark.renderer]
  unsafe = true

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML"]

# ============================================================================
#  导航 —— 2026-10-12 新增：与主站 hulatu.com 的 [[menu.main]] **逐项一致**
#  四个子站各写一份（独立 Hugo 站点，没有共享配置的机制），改要四处一起改。
#  ⚠️ 子站里必须写**绝对地址**：子域名与主站不同源，`/about/` 会 404。
#  ⚠️ weight 与主站保持一致（Hub 卡 15、Weekly 卡 45），顺序才对得上。
#  ⚠️ 本页自己就是导航里的 Hub —— 在 profile 上点 Hub 会原地重载本站，
#     这是预期的（导航是全站统一的一套，不做「当前页高亮」）。
# ============================================================================
[[menu.main]]
  name = "Home"
  url = "https://hulatu.com/"
  weight = 10

[[menu.main]]
  name = "Hub"
  url = "https://profile.hulatu.com/"
  weight = 15

[[menu.main]]
  name = "About"
  url = "https://hulatu.com/about/"
  weight = 20

[[menu.main]]
  name = "Now"
  url = "https://hulatu.com/now/"
  weight = 30

[[menu.main]]
  name = "Links"
  url = "https://hulatu.com/roll/"
  weight = 40

[[menu.main]]
