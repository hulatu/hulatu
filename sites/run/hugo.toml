baseURL = "https://run.hulatu.com/"
title = "胡拉图 · 跑步"
locale = "zh-CN"
hasCJKLanguage = true
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

# 跑步数据只有一份，在仓库根目录的 data/runs.json。
# 这里直接挂载上层目录，不再往子站复制副本——复制过的那份曾经比主站少两次跑步记录。
[[module.mounts]]
  source = "../../data"
  target = "data"

[markup.goldmark.renderer]
  unsafe = true

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML"]

# ============================================================================
#  导航 —— 2026-10-12 新增：与主站 hulatu.com 的 [[menu.main]] **逐项一致**
#
#  用户要求「子站按 BearNeo 重新设计，和主站风格统一」，所以四个子站的页头
#  现在和主站长得一模一样：站名（h1）+ 同一套 8 项导航。
#
#  ⚠️ 四个子站各写一份 —— 子站是**独立的 Hugo 站点**，没有共享配置/共享 CSS
#     的机制。改主站导航就要回来改这四处（见 sites/README.md 那张表）。
#  ⚠️ 子站里所有链接都必须是**绝对地址**：子域名与主站不同源，
#     写 `/about/` 会落到 run.hulatu.com/about/ 上（404）。
#  ⚠️ weight 与主站保持一致（Hub 卡 15、Weekly 卡 45），顺序才对得上。
# ============================================================================
[[menu.main]]
  name = "Home"
  url = "https://hulatu.com/"
  weight = 10

[[menu.main]]
  name = "Hub"
  url = "https://profile.hulatu.com/"
  weight = 15

[[menu.main]]
  name = "About"
  url = "https://hulatu.com/about/"
  weight = 20

[[menu.main]]
  name = "Now"
  url = "https://hulatu.com/now/"
  weight = 30

[[menu.main]]
  name = "Links"
  url = "https://hulatu.com/roll/"
  weight = 40

[[menu.main]]
  name = "Weekly"
  url = "https://hulatu.com/weekly/"
  weight = 45

[[menu.main]]
  name = "Posts"
  url = "https://hulatu.com/archive/"
  weight = 50

[[menu.main]]
  name = "RSS"
  url = "https://hulatu.com/index.xml"
  weight = 60
