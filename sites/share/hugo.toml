baseURL = "https://share.hulatu.com/"
title = "胡拉图 · 经验分享"
locale = "zh-CN"
hasCJKLanguage = true
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[markup.goldmark.renderer]
  unsafe = true

[minify]
  disableXML = true
  minifyOutput = true

[permalinks]
  posts = "/:year/:month/:slug/"

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]
