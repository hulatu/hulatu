<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博客后台 · 胡拉图说</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>

<div class="app">

  <!-- ================= 左侧栏 ================= -->
  <aside class="rail">
    <header class="rail-brand">
      <span class="seal">胡</span>
      <span class="rail-brand-text">
        <b>胡拉图说</b>
        <small>本地后台</small>
      </span>
      <button class="icon-btn rail-theme" id="btn-theme" title="切换深浅色" aria-label="切换深浅色">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
    </header>

    <nav class="rail-nav" id="rail-nav" aria-label="内容分组"></nav>

    <div class="rail-scroll">
      <section class="rail-group">
        <h3>状态</h3>
        <div class="chips" id="status-chips">
          <button class="chip is-on" data-status="all">全部</button>
          <button class="chip" data-status="draft">草稿</button>
          <button class="chip" data-status="published">已发布</button>
        </div>
      </section>

      <section class="rail-group">
        <h3>分类</h3>
        <div class="chips" id="cat-chips"></div>
      </section>

      <section class="rail-group">
        <h3>标签 <span class="rail-note" id="tag-note"></span></h3>
        <div class="chips chips-dense" id="tag-chips"></div>
      </section>
    </div>

    <footer class="rail-foot">
      <div class="git-line" id="git-state">正在读取仓库状态…</div>
      <div class="rail-actions">
        <button class="btn" id="btn-preview">
          <span class="dot" id="preview-dot"></span>本地预览
        </button>
        <button class="btn btn-primary" id="btn-publish">发布上线</button>
      </div>
    </footer>
  </aside>

  <!-- ================= 主区域 ================= -->
  <main class="main" id="main"></main>

</div>

<div class="toasts" id="toasts"></div>
<div class="modal" id="modal" hidden><div class="modal-card" id="modal-card"></div></div>

<script src="/ui/app.js"></script>

<!--
  兜底提示（故意写成行内样式，因为它要能在 style.css 取不到时也看得清）。

  这个文件正常应该由 admin/server.py 提供（那个服务会把 style.css 和 app.js
  直接内联进这一份 HTML）。如果它是被**当成普通静态文件**打开的 —— 比如某些
  预览面板、或者直接双击文件 —— /ui/app.js 会 404，页面就只剩一片空白，
  看起来像「坏了」。这里检测一下，给一句能照做的提示，别让人对着白屏猜。

  app.js 第一行会设 window.__BLOG_ADMIN_BOOTED__，所以这个判断是可靠的：
  只要脚本加载成功，下面这段就什么都不会做。
-->
<div id="boot-guard" hidden style="
  max-width: 640px; margin: 12vh auto; padding: 28px 30px;
  font: 15px/1.75 -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  color: #1d1d1f; background: #fff; border: 1px solid #e4e4e9;
  border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.07);">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <span style="width:30px;height:30px;border-radius:8px;background:#c73e2f;color:#fff8f5;
                 display:grid;place-items:center;font-weight:600;flex:none">胡</span>
    <b style="font-size:17px">这个页面要通过后台服务打开</b>
  </div>
  <p style="margin:0 0 12px;color:#56565c">
    你现在打开的是 <code>admin/ui/index.html</code> 这个文件本身。它的样式和脚本是分开的，
    只有由后台服务提供时才会被内联进来，单独打开就会是一片空白。
  </p>
  <p style="margin:0 0 12px">正确做法是<strong>双击仓库根目录的「博客后台.command」</strong>，
     或者在终端里跑：</p>
  <pre style="margin:0 0 14px;padding:10px 12px;background:#f6f6f8;border:1px solid #e4e4e9;
              border-radius:7px;font:13px/1.6 ui-monospace,Menlo,monospace;overflow:auto">cd ~/Blog &amp;&amp; ./admin/start.sh</pre>
  <p style="margin:0;color:#56565c">然后浏览器会自动打开
     <code>http://127.0.0.1:8787/</code>。</p>
</div>

<script>
  setTimeout(function () {
    if (!window.__BLOG_ADMIN_BOOTED__) {
      document.getElementById('boot-guard').hidden = false;
    }
  }, 1500);
</script>
</body>
</html>
