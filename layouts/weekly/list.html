{{ define "main" }}
<h1 class="page-title">{{ .Title }}</h1>
{{ if .Content }}<div class="page-intro">{{ .Content }}</div>{{ end }}

<a class="rss-guide" href="{{ "weekly/index.xml" | relURL }}">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
    <path d="M4 11a9 9 0 0 1 9 9h-2.5A6.5 6.5 0 0 0 4 13.5V11z"></path>
    <path d="M4 4a16 16 0 0 1 16 16h-2.5A13.5 13.5 0 0 0 4 6.5V4z"></path>
    <circle cx="5" cy="19" r="2"></circle>
  </svg>
  <span class="rss-guide-text">
    <span class="rss-guide-title">订阅周刊</span>
    <span class="rss-guide-desc">用 RSS 阅读器接收每一期更新</span>
  </span>
  <span class="rss-guide-arrow" aria-hidden="true">→</span>
</a>

{{ if .Pages }}
  <section class="post-list">
    {{ range .Pages }}
      {{ partial "post-row.html" . }}
    {{ end }}
  </section>
{{ else if not .Content }}
  <p class="empty-tip">这里还没有内容。</p>
{{ end }}
{{ end }}
