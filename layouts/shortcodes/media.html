<figure class="media-card">
  {{ with .Get "cover" }}<img class="media-cover" src="{{ . | relURL }}" alt="{{ $.Get "title" }}" loading="lazy">{{ end }}
  <figcaption class="media-body">
    <p class="media-title">{{ .Get "title" }}</p>
    {{ with .Get "creator" }}<p class="media-creator">{{ . }}</p>{{ end }}
  </figcaption>
</figure>
