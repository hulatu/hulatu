<div class="book-row">
  {{ with .Get "cover" }}<img class="book-cover" src="{{ . | relURL }}" alt="{{ $.Get "title" }}" loading="lazy">{{ end }}
  <div class="book-body">
    <span class="book-title">{{ .Get "title" }}</span>
    <span class="book-meta">{{ .Get "creator" }}{{ with .Get "year" }} · {{ . }}{{ end }}</span>
  </div>
  {{ with .Get "rating" }}<span class="book-rating">★ {{ . }}</span>{{ end }}
</div>
