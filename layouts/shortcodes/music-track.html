<button type="button" class="music-track" data-src="{{ .Get "src" }}" aria-pressed="false">
  <span class="music-track-icon" aria-hidden="true">▶</span>
  <span class="music-track-meta">
    <span class="music-track-title">{{ .Get "title" }}</span>
    <span class="music-track-artist">{{ .Get "artist" }}</span>
  </span>
</button>
