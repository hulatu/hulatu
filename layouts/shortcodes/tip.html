{{- $title := .Get 0 -}}
<aside class="callout callout-tip">
  <div class="callout-head">
    <span class="callout-icon" aria-hidden="true">💡</span>
    {{- with $title }}<span class="callout-title">{{ . }}</span>{{ end -}}
  </div>
  <div class="callout-body">{{ .Inner | markdownify }}</div>
</aside>
