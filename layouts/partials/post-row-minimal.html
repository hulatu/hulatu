{{- /* 周刊列表页和分类/标签词条页用的极简行：标题 + 日期，没有分类角标。
       这个标记以前在 layouts/weekly/list.html 和 layouts/_default/taxonomy.html
       里各写了一份（其中一份还漏了 .minimal-meta 外壳），同样抽出来共用。 */ -}}
<a class="minimal-row" href="{{ .Permalink }}">
  <span class="minimal-title">{{ .Title }}</span>
  <span class="minimal-meta">
    <time class="minimal-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
  </span>
</a>
