{{- $page := . -}}
{{- $eager := false -}}
{{- if reflect.IsMap . -}}
  {{- $page = .page -}}
  {{- $eager = .eager | default false -}}
{{- end -}}
{{- $thumb := partial "thumb-src.html" $page -}}
{{- $src := $thumb.src -}}
{{- if $src -}}
  <span class="post-thumb">
    <img src="{{ $src | relURL }}" alt="" width="64" height="64"{{ with $thumb.srcset }} srcset="{{ . }}" sizes="(max-width: 400px) 50px, (max-width: 600px) 56px, 64px"{{ end }} loading="{{ if $eager }}eager{{ else }}lazy{{ end }}"{{ if $eager }} fetchpriority="high"{{ end }} decoding="async">
  </span>
{{- else -}}
  <span class="post-thumb post-thumb-fallback" aria-hidden="true">{{ substr $page.Title 0 1 }}</span>
{{- end -}}
