{{- $page := . -}}
{{- $eager := false -}}
{{- if reflect.IsMap . -}}
  {{- $page = .page -}}
  {{- $eager = .eager | default false -}}
{{- end -}}
{{- $src := partial "thumb-src.html" $page -}}
{{- if $src -}}
  <span class="post-thumb">
    <img src="{{ $src | relURL }}" alt="" width="128" height="128" loading="{{ if $eager }}eager{{ else }}lazy{{ end }}"{{ if $eager }} fetchpriority="high"{{ end }} decoding="async">
  </span>
{{- else -}}
  <span class="post-thumb post-thumb-fallback" aria-hidden="true">{{ substr $page.Title 0 1 }}</span>
{{- end -}}
