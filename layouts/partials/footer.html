<footer class="site-footer">
  <div class="container footer-container">
    {{- /* 卷末统计（篇数 / 字数 / 写作时长）2026-10-05 加过一版，同日按用户要求撤掉：
         页脚只留「版权 / 链接 / 协议」那一行。统计口径的复用点（archive.html 的
         `$posts` 筛选与 `.WordCount`）没变，想再加回来照着那天的方式算就行。 */ -}}
    <p class="footer-copyright">&copy; {{ site.Params.since }}&ndash;{{ now.Format "2006" }} {{ site.Params.author }}</p>

    <p class="footer-links">
      <a href="https://profile.hulatu.com/" target="_blank" rel="noopener">花园</a>
      <a href="{{ "friends/" | relURL }}">友链</a>
      <a href="https://www.travellings.cn/go.html" target="_blank" rel="noopener" title="开往-友链接力">开往</a>
      <a href="{{ "privacy/" | relURL }}">隐私</a>
      {{ if site.Params.email }}
      <a href="mailto:{{ site.Params.email }}">邮箱</a>
      {{ end }}
    </p>

    <a class="footer-license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh-hans" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>
  </div>
</footer>
