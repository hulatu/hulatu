<footer class="site-footer">
  <div class="container footer-container">
    <p class="footer-copyright">&copy; {{ site.Params.since }}&ndash;{{ now.Format "2006" }} {{ site.Params.author }}</p>

    <p class="footer-icon-links">
      <a href="{{ "series/" | relURL }}" aria-label="系列" title="系列">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5Z"></path><path d="M2 12l10 5 10-5"></path><path d="M2 17l10 5 10-5"></path></svg>
      </a>

        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path><path d="M2 21c.7-3.1 3.2-5 7-5s6.3 1.9 7 5"></path><path d="M16 4.5a4 4 0 0 1 0 7.5"></path><path d="M22 21c-.4-1.7-1.3-3-2.7-3.9"></path></svg>

      <a href="mailto:{{ site.Params.email }}" aria-label="邮箱" title="邮箱">
