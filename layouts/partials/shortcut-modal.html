<div class="shortcut-overlay" id="shortcut-overlay" hidden>
  <div class="shortcut-panel" role="dialog" aria-modal="true" aria-label="键盘快捷键">
    <div class="shortcut-head">
      <span class="shortcut-title">键盘快捷键</span>
      <button type="button" class="shortcut-close" id="shortcut-close" aria-label="关闭快捷键面板">✕</button>
    </div>
    <ul class="shortcut-list">
      <li class="shortcut-row">
        <span class="shortcut-keys"><kbd>⌘</kbd><kbd>K</kbd></span>
        <span class="shortcut-desc">打开搜索</span>
      </li>
      <li class="shortcut-row">
        <span class="shortcut-keys"><kbd>/</kbd></span>
        <span class="shortcut-desc">快速搜索</span>
      </li>
      <li class="shortcut-row">
        <span class="shortcut-keys"><kbd>t</kbd></span>
        <span class="shortcut-desc">回到顶部</span>
      </li>
      <li class="shortcut-row">
        <span class="shortcut-keys"><kbd>[</kbd><kbd>]</kbd></span>
        <span class="shortcut-desc">上一篇 / 下一篇</span>
      </li>
      <li class="shortcut-row">
        <span class="shortcut-keys"><kbd>?</kbd></span>
        <span class="shortcut-desc">打开 / 关闭本面板</span>
      </li>
      <li class="shortcut-row">
        <span class="shortcut-keys"><kbd>Esc</kbd></span>
        <span class="shortcut-desc">关闭搜索 / 目录 / 弹层</span>
      </li>
    </ul>
    <p class="shortcut-foot">浏览图集时还可使用 ← → 切换图片</p>
  </div>
</div>
