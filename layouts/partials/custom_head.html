{{- /* 图床预连（2026-10-25 新增）。
       正文图片全部来自 img.hulatu.com，是一个**跨域主机** —— 不预连的话，
       浏览器要等 HTML 解析到第一个 <img> 才开始 DNS + TCP + TLS。
       实测该主机 TLS 0.63–0.86 s、首字节 1.6–2.1 s，这段延迟完全落在首屏上。

       ⚠️ 用 `.Content` 判断「这一页到底有没有图床图片」，而不是全站无脑加：
          全站 256 个 HTML 页里只有 **74 页**含 `<img>`，其余 182 页连了也用不上，
          白建一个连到 10 秒后自动关闭的空连接。`.Content` 在这里调用是安全的 ——
          Hugo 会缓存渲染结果，body 里再取不会重跑渲染钩子。
       ⚠️⚠️ 判据必须**同时**要求出现 `<img`（2026-10-28 修）。只判主机名会误命中
          三类页面：`/`（正文里有个指向图床的「支持」链接）、`/about/`（二维码链接）、
          `/privacy/`（正文用文字提到了这个域名）—— 它们都把 `img.hulatu.com`
          写成了 `<a href>` 或纯文本，一个 `<img>` 都没有。
          实测：只判主机名 → 77 页挂预连；加上 `<img` → 正好 74 页。
          ⚠️ giscus 的预连已改为接近评论区时由 JS 动态加入，不再出现在静态 HTML；
             验收本项时应只数 `href="https://img.hulatu.com"` 的 preconnect。
       ⚠️ **不要加 crossorigin**：`<img src>` 是 no-cors 请求，匹配的是
          **不带** crossorigin 的 preconnect 连接池。写了 crossorigin 反而
          建出一个用不上的 CORS 连接池，等于没预连。 */ -}}
{{- with .Content -}}
  {{- if and (strings.Contains . "img.hulatu.com") (strings.Contains . "<img") }}
<link rel="preconnect" href="https://img.hulatu.com">
<link rel="dns-prefetch" href="https://img.hulatu.com">
  {{- end -}}
{{- end }}

{{- /* ---------------------------------------------------------------
       移动端地址栏 / 任务切换器配色。

       本站是**纯 `prefers-color-scheme`**（没有手动主题开关，也没有
       toggle 脚本），所以这里给浅 / 深两档各写一条 media 限定即可，
       不需要 JS。取值与主题的两个底色 token 一致：
         浅色 --bg-color-primary  #fdfdfd
         深色 --bg-color-primary  #121212
       ⚠️ 换主题底色要同步改这里（写错不报错，只是地址栏颜色和页面不搭）。

       ⚠️ 必须写 media 的**两条**，而不是在 `:root` 上写 `color-scheme` 之外
          再靠 `<meta>` 推断 —— theme-color 只接受值，媒体条件版才是标准写法。
      --------------------------------------------------------------- */ -}}
<meta name="theme-color" content="#fdfdfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

{{- /* ---------------------------------------------------------------
       CSS 管道（2026-11-06 新增，F3）

       主题与站点两份 CSS 拼成一个文件，再压缩、指纹化。
       顺序不能换：主题在前、站点补丁在后 —— 站点层靠「后出现者胜」
       覆盖主题（以前是两个 <style> 块的先后顺序，现在是拼合顺序）。
       指纹在文件名里（main.min.<hash>.css），内容一变文件名就变，
       所以 static/_headers 里 /css/* 可以放心写 1 年 + immutable。
       preload 让首屏不等 HTML 解析完才开始拿 CSS（抵消多一次请求）。
       integrity 是 SRI 校验，与 giscus.js / code-copy.js 同一做法。
       --------------------------------------------------------------- */ -}}
{{- $themeCSS := resources.Get "css/theme.css" -}}
{{- $customCSS := resources.Get "css/custom.css" -}}
{{- $css := slice $themeCSS $customCSS | resources.Concat "css/main.css" | minify | fingerprint -}}
<link rel="preload" href="{{ $css.RelPermalink }}" as="style">
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}" crossorigin="anonymous">

{{- /* ============================================================
       统计（GoatCounter）
       上游主题的 baseof.html 里没有统计的挂载点，所以挂在站点层的这个
       「用户可覆盖」钩子里（baseof 会 partial "custom_head.html"）。
       行为与改版前的 layouts/partials/analytics.html 逐字一致：
       延迟到空闲 / 首次滚动 / 首次指针按下才真正下载脚本，并且跳过
       被预渲染（Speculation Rules）的页面 —— 否则鼠标扫过链接也算一次浏览。
       ============================================================ */ -}}
{{- with site.Params.analytics -}}
  {{- with .goatcounter -}}
    <script>
      (function () {
        var loaded = false;
        function load() {
          if (loaded) return;
          loaded = true;
          var endpoint = "{{ . }}";
          var s = document.createElement("script");
          s.async = true;
          /* ⚠️ 2026-10-14：原来写的是协议相对 `//gc.zgo.at/count.js`。
             协议相对 URL 是 HTTP/1 时代的历史遗留 —— 页面从
             file:// 打开、或任何非 http(s) 上下文下它会解析失败。
             写死 https:// 全场景一致。 */
          s.src = "https://gc.zgo.at/count.js";
          s.dataset.goatcounter = endpoint;
          document.body.appendChild(s);
        }
        function schedule() {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(load, { timeout: 2000 });
          } else {
            window.addEventListener("scroll", load, { once: true, passive: true });
            window.addEventListener("pointerdown", load, { once: true, passive: true });
            setTimeout(load, 3000);
          }
        }
        if (document.prerendering) {
          document.addEventListener("prerenderingchange", schedule, { once: true });
        } else {
          schedule();
        }
      })();
    </script>
  {{- end -}}
{{- end -}}

{{- /* ---------------------------------------------------------------
       Speculation Rules：站内跳转**预渲染**（2026-10-28 新增）

       ── 为什么加这个 ────────────────────────────────────────────────
       本站在「加载层」已经没什么可优化的了：0 个阻塞资源、0 个 webfont、
       外链 JS 只有 giscus / code-copy 两个小文件、HTML 6–10 KB（gzip）。
       剩下唯一的体验缺口在**站内跳转**——每次点导航 / 文章卡片，都要等
       一次完整的导航往返。博客读者的典型行为是「进来一次，站内跳 3–5 篇」，
       所以这一项比继续压缩首屏更贴近真实体验。

       预渲染 = 浏览器在**后台先把目标页整页渲染好**，用户真点下去时直接换帧，
       没有白屏、没有布局跳动。对本站这种「页面只有 6 KB、零外部依赖」的站，
       预渲染一页的成本极低。

       ── 为什么是 `moderate` 而不是 `eager` / `conservative` ──────────
         conservative  只在用户真的按下鼠标（pointerdown）时才渲染 —— 太晚，
                       在网络慢的环境下等于没赶上。
         moderate      鼠标悬停约 200 ms 或 pointerdown 时渲染 —— 这里选的。
                       悬停本身就是「很可能要点」的强信号，命中率高、浪费少。
         eager         链接一进视口就渲染 —— 列表页一屏十几个链接，会同时
                       预渲染好几页，把带宽吃光，**别改成这个**。

       ── 为什么本站可以放心开 ────────────────────────────────────────
       · 统计（GoatCounter）那段脚本**已经**带 `document.prerendering` 守卫
         （见上面那个 partial 里的 IIFE）：预渲染期间不加载，页面被激活后
         才通过 `prerenderingchange` 事件补发。不会多算一次访问。
       · 评论区（giscus）是「滚到评论区前 300 px 才注入」，预渲染的页面不滚动，
         所以不会触发；用户真进去之后滚动行为与普通加载完全一致。
       · 全站没有 Service Worker、没有会写 localStorage 的脚本，预渲染不会
         产生副作用。

       ── 想关掉 ──────────────────────────────────────────────────────
       删掉下面这一个 `<script>` 块即可，没有其他联动（不删也没坏处：
       不支持的浏览器——Safari / Firefox——会直接忽略这个 type）。

       ⚠️ `href_matches` 写 `/*` 是**相对本文档的 URL** 解析的，所以只命中
          同源路径，外链不会被预渲染。别把它换成「跨源全通配」那种写法
          （那会真的去预渲染外站）。
       ⚠️ 别把 `/*` 写成 `/**`：URLPattern 里 `**` 是跨段的通配，语义不同。
      --------------------------------------------------------------- */ -}}
