{{- $jsFiles := slice -}}
{{- range (slice "theme" "ui" "toc" "lightbox" "search") -}}
  {{- $jsFiles = $jsFiles | append (resources.Get (printf "js/%s.js" .)) -}}
{{- end -}}
{{- $bundle := $jsFiles | resources.Concat "js/bundle.js" | minify | fingerprint -}}

<script src="{{ $bundle.RelPermalink }}" integrity="{{ $bundle.Data.Integrity }}" crossorigin="anonymous" defer></script>
