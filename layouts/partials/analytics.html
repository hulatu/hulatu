{{- with site.Params.analytics -}}
  {{- with .umami -}}
    <script defer src="{{ . }}" data-website-id="{{ site.Params.analytics.umamiId }}"></script>
  {{- end -}}
  {{- with .goatcounter -}}
    <script>
      (function () {
        var loaded = false;
        function load() {
          if (loaded) return;
          loaded = true;
          var endpoint = "{{ . }}";
          var s = document.createElement("script");
          s.async = true;
          s.src = "//gc.zgo.at/count.js";
          s.dataset.goatcounter = endpoint;
          document.body.appendChild(s);
        }
        function schedule() {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(load, { timeout: 2000 });
          } else {
            window.addEventListener("scroll", load, { once: true, passive: true });
            window.addEventListener("pointerdown", load, { once: true, passive: true });
            setTimeout(load, 3000);
          }
        }
        // 被预渲染（prerender）的页面先不计：等它真的被用户打开（prerenderingchange）再上报，
        // 否则鼠标扫过链接也会被算成一次浏览。
        if (document.prerendering) {
          document.addEventListener("prerenderingchange", schedule, { once: true });
        } else {
          schedule();
        }
      })();
    </script>
  {{- end -}}
{{- end -}}
