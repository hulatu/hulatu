{{ define "main" }}
<div class="notfound">
  <p class="notfound-code" aria-hidden="true">404</p>
  <p class="notfound-text">这里什么也没有。可以看看最近写下的文字。</p>
</div>

<section class="notfound-list">
  <h2 class="related-title">最近更新</h2>
  <div class="post-list">
    {{ range first 3 (where site.RegularPages "Type" "posts") }}
      {{ partial "post-row.html" . }}
    {{ end }}
  </div>
</section>
{{ end }}
