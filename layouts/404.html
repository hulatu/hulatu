{{ define "main" }}
<div class="notfound">
  <p class="notfound-code" aria-hidden="true">404</p>
  <p class="notfound-text">这里什么也没有。可以回首页，或者搜一下想找的内容。</p>
  <div class="notfound-actions">
    <a class="notfound-btn notfound-btn-primary" href="{{ "/" | relURL }}">回首页</a>
    <button type="button" class="notfound-btn" data-open-search data-index="{{ "search-index.json" | relURL }}">搜索文章</button>
  </div>
</div>

<section class="notfound-list">
  <h2 class="related-title">最近更新</h2>
  <div class="post-list">
    {{- /* 「最近更新」按整站内容算，周刊也是内容，不该漏 */ -}}
    {{ range first 3 (where site.RegularPages "Type" "in" (slice "posts" "weekly")) }}
      {{ partial "post-row.html" . }}
    {{ end }}
  </div>
</section>
{{ end }}
