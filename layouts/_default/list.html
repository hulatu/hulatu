{{ define "main" }}
{{ if not .Params.hide_title }}<h1 class="page-title">{{ .Title }}</h1>{{ end }}
{{ if .Content }}<div class="page-intro">{{ .Content }}</div>{{ end }}

{{ if .Pages }}
  <section class="post-list">
    {{ range .Pages }}
      {{ partial "post-row.html" . }}
    {{ end }}
  </section>
{{ else if not .Content }}
  <p class="empty-tip">这里还没有内容。</p>
{{ end }}
{{ end }}
