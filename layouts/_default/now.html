{{ define "main" }}
<article class="now-page">
  <h1 class="page-title">{{ .Title }}</h1>
  {{ with .Description }}<p class="page-intro">{{ . }}</p>{{ end }}

  <div class="post-content now-content">
    {{ .Content }}
  </div>

  <p class="post-meta now-updated">
    <span>更新于 {{ .Lastmod.Format "2006-01-02" }}</span>
  </p>
</article>
{{ end }}
