<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} - {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else if .IsPage }}{{ .Summary | plainify | truncate 160 }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta name="theme-color" content="#c73e2f">
  <link rel="preconnect" href="https://giscus.app">
  <link rel="dns-prefetch" href="https://giscus.app">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ site.Params.assets.favicon16x16 | default "/favicon.png" | relURL }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.Params.assets.favicon32x32 | default "/favicon.png" | relURL }}">
  <link rel="apple-touch-icon" href="{{ site.Params.assets.apple_touch_icon | default "/favicon.png" | relURL }}">
  <link rel="mask-icon" href="{{ site.Params.assets.safari_pinned_tab | default "/favicon.png" | relURL }}" color="#c73e2f">
  {{- $css := resources.Get "css/style.css" | minify | fingerprint -}}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
  <link rel="alternate" type="application/rss+xml" href="{{ "index.xml" | relURL }}" title="{{ site.Title }}">
  <link rel="alternate" type="application/atom+xml" href="{{ "atom.xml" | relURL }}" title="{{ site.Title }} · Atom">
  <link rel="alternate" type="application/feed+json" href="{{ "feed.json" | relURL }}" title="{{ site.Title }} · JSON Feed">
  {{ partial "head-meta.html" . }}
  {{ partial "analytics.html" . }}
  <!-- 提前读取主题偏好，避免深色模式下出现"白屏闪烁" -->
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = saved || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) themeMeta.setAttribute("content", theme === "dark" ? "#16181c" : "#c73e2f");
    })();
  </script>
</head>
<body>
  {{ partial "header.html" . }}

  <main class="container">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "search-modal.html" . }}

  <div class="pjax-progress" id="pjax-progress" aria-hidden="true"></div>
  <button type="button" class="back-top" id="back-top" aria-label="回到顶部" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path>
    </svg>
  </button>

  {{ partial "scripts.html" . }}
</body>
</html>
