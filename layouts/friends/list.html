{{ define "main" }}
<div class="friends-page">
  <header class="friends-head">
    <h1 class="page-title">{{ .Title }}</h1>
  </header>

  <p class="friends-exchange"><a href="mailto:{{ site.Params.email }}?subject=友链申请">交换友链</a></p>

  {{ with .Params.friends }}
  <section class="friends-section">
    <h2 class="friends-section-title">朋友</h2>
    <ul class="friends-list">
      {{ range . }}
        <li><a href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a></li>
      {{ end }}
    </ul>
  </section>
  {{ end }}

  {{ with .Params.communities }}
  <section class="friends-section">
    <h2 class="friends-section-title">博客圈与组织</h2>
    <ul class="friends-list">
      {{ range . }}
        <li><a href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a></li>
      {{ end }}
    </ul>
  </section>
  {{ end }}
</div>
{{ end }}
