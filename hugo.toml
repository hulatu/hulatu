baseURL = "https://hulatu.com/"
locale = "zh-CN"
title = "胡拉图说"
hasCJKLanguage = true
enableRobotsTXT = true
copyright = "本站内容采用 CC BY-NC-SA 4.0 协议"

[pagination]
  pagerSize = 10

[services.rss]
  # 每个 feed 输出的条目上限（-1 表示不限制）。全文输出，条数放大反而拖慢订阅端
  limit = 20

[related]
  threshold = 60
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
  
[imaging]
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 75
  [imaging.webp]
    quality = 75
  [imaging.avif]
    quality = 75
  
[minify]
  disableXML = true
  minifyOutput = true

# 版本约束：本机、GitHub Actions 和 Cloudflare Pages 三边用同一个版本，避免
# 「本地构建正常、平台构建失败」这种只有上线才发现的问题。
# extended 是硬要求，不是偏好：layouts/partials/head-meta.html 要用 imageConfig
# 读 static/images/share.webp 的宽高，标准版 Hugo 解不了 WebP。
# 改这里时记得同步 .github/workflows/build.yml、README / MAINTENANCE / sites/README
# 里写的版本号，以及 Cloudflare 五个项目的 HUGO_VERSION。
[module]
  [module.hugoVersion]
    min = "0.167.0"
    extended = true

[permalinks]
  posts = "/posts/:year/:month/:day/:slug/"
  weekly = "/posts/:year/:month/:day/:slug/"

[params]
  description = "胡拉图说：一个普通研究生的个人博客，喜欢记录思考、分享日常、观察生活，内容包含但不限于运动、健康、成长、科研与工具折腾。"
  author = "胡拉图"
  since = "2025"
  email = "hello@hulatu.com"
  avatar = "/images/avatar.webp"
  # 豆瓣 ID —— 书影音页 /media/ 的数据来源（scripts/sync-douban.py 读这里，
  # 所以平时跑同步不用带 --uid）。填个人主页 URL 里 /people/<这一段>/ 。
  # 留空则脚本必须显式传 --uid。
  # 2026-10-08 填上：https://www.douban.com/people/230092146/
  doubanId = "230092146"
  # 头像是否走 Cloudflare Image Transformations 缩放（layouts/_default/about.html）。
  # 开：模板给头像套 /cdn-cgi/image/width=…，按实际显示尺寸（148px / 2x 296px）取图，
  #     实测从 14KB 降到 3.6–8.4KB；顺带避开 Polish 把 .webp 兜底重编码成 21KB JPEG 的问题。
  # 关：直接发 static 里的原图。留这个开关是因为头像在关键路径上（eager + fetchpriority=high），
  #     万一哪天 Image Transformations 不可用，改一个字就能回退，不用动模板。
  avatarCDN = true

  # 自有图片 CDN：正文图片通过 Cloudflare Image Transformations 动态压缩
  [params.imageCDN]
    host = "img.hulatu.com"

  # 打赏：这块现在**只出现在关于页**（layouts/_default/about.html），文章页已移除。
  # 所以 hint 写的是「本站」而不是「这篇文章」——它是全站唯一一处打赏文案，
  # 模板不再传自己的 hint 覆盖（见 layouts/partials/donate.html）。
  #
  # 收款码是**站内静态资源**（static/images/donate/），不再是图床图（2026-10-02 第四轮）。
  # 理由：它是「站点家具」而不是文章内容，性质和头像 / 分享卡一样，所以跟它们一起放
  # /images/（那条路径在 static/_headers 里已经配了 30 天缓存）；顺带也不必再套一层
  # Cloudflare 图片变换（layouts/partials/cf-image.html 现在只服务正文插图）。
  # 换码的正确姿势：把新图裁成「二维码本体 + 白静区」的正方形 webp 覆盖同名文件
  # （生成与校验脚本的思路见 MAINTENANCE.md 的「打赏」一行），然后去 Cloudflare 后台
  # Purge 一次 /images/donate/* —— 30 天缓存，不 purge 的话老访客看到的还是旧码。
  # 想放回图床：把下面两行换成完整 https URL 即可，cf-image.html 会重新接管压缩。
  # 或用第三方平台（如爱发电）填 url。微信、支付宝、url 全空时整块不显示。
  [params.donate]
    enabled = true
    title = "支持"
    hint = "如果本站对你有帮助，可以请我喝杯咖啡"
    button = "打赏支持"
    # 收款方显示名：微信和支付宝的收款码上都是这一串，展开后由模板写成一行提示，
    # 让付款的人可以先核对再扫。两边的名字不一样就拆成 wechatPayee / alipayPayee。
    payee = "hututu(**朋)"
    wechat = "/images/donate/wechat.webp"
    alipay = "/images/donate/alipay.webp"
    url = ""
    urlLabel = "去爱发电支持我"

[params.assets]
  # 页头那个大 logo（深色模式下由 CSS 的 filter 反白）
  logo = "/logo.svg"
  # 标签页图标：内置了 prefers-color-scheme 深色适配，和页头 logo 是两个文件，
  # 别混用——favicon 里的反白规则会和页头的 filter 叠加，变成反色
  favicon = "/favicon.svg"
  apple_touch_icon = "/apple-touch-icon.png"
  safari_pinned_tab = "/logo.svg"
  shareImage = "/images/share.webp"
   
[params.giscus]
  enabled = true
  repo = "hulatu/hulatu"
  repoId = "R_kgDOTApIwg"
  category = "Announcements"
  categoryId = "DIC_kwDOTApIws4DCXd5"
  mapping = "pathname"
  strict = false
  reactions = true
  emitMetadata = false
  inputPosition = "bottom"
  lang = "zh-CN"
  theme = "preferred_color_scheme"

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]
  # 栏目默认不出 RSS：只有首页主源（/index.xml）和周刊（content/weekly/_index.md 单独开）
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6
  [markup.highlight]
    noClasses = false     

[menu]
  # 导航顺序由 weight 决定，和下面的书写顺序无关（Hugo 按 weight 排）。
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 1
  # 2026-10-08：这一位原先排的是「现在」(/now/)，同日又撤了 —— 那一页整个删掉，
  # 因为「现在」和「片刻」都在讲「此刻的我」，两条挨着读是重复的，留「片刻」一条就够。
  # 撤掉后把后面四项的 weight 整体前移一位（3/4/5/6 → 2/3/4/5），不留空号 ——
  # 空号看着像「这里原来有东西被删了」，读代码的人要多想一秒。
  [[menu.main]]
    name = "片刻"
    url = "/moments/"
    weight = 2
  [[menu.main]]
    name = "归档"
    url = "/archive/"
    weight = 3
  [[menu.main]]
    name = "周刊"
    url = "/weekly/"
    weight = 4
  [[menu.main]]
    name = "分类"
    url = "/categories/"
    weight = 5

[taxonomies]
  category = "categories"
  tag = "tags"

# 隐私友好的轻量统计：只使用 GoatCounter
# goatcounter 填 GoatCounter 后台 Site code 里的完整计数地址
[params.analytics]
  goatcounter = "https://hulatu.goatcounter.com/count"
