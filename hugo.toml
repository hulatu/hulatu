baseURL = "https://hulatu.com/"
locale = "zh-CN"
title = "胡拉图说"
hasCJKLanguage = true
enableRobotsTXT = true
copyright = "本站内容采用 CC BY-NC-SA 4.0 协议"

[pagination]
  pagerSize = 6

[services.rss]
  # -1 表示不限制条目数，输出全部 posts 和 weekly 文章
  limit = -1

[related]
  threshold = 60
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
  
[imaging]
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 75
  [imaging.webp]
    quality = 75
  [imaging.avif]
    quality = 75
  
[minify]
  disableXML = true
  minifyOutput = true
  
[permalinks]
  posts = "/posts/:year/:month/:day/:slug/"
  weekly = "/posts/:year/:month/:day/:slug/"

[params]
  description = "胡拉图说：一个普通研究生的个人博客，喜欢记录思考、分享日常、观察生活，内容包含但不限于运动、健康、成长、科研与工具折腾。"
  author = "胡拉图"
  since = "2025"
  github = "https://github.com/hulatu"
  email = "flyhulatu@gmail.com"
  avatar = "/images/avatar.webp"

  # 自有图片 CDN：封面/缩略图/正文图片通过 Cloudflare Image Transformations 动态压缩
  [params.imageCDN]
    host = "img.hulatu.com"

  # 打赏：把微信/支付宝赞赏码图片放进 static/img/ 并填好路径；
  # 或用第三方平台（如爱发电）填 url。全部留空时页面不显示。
  [params.donate]
    enabled = true
    hint = "如果这篇文章对你有帮助，可以请我喝杯咖啡"
    button = "打赏支持"
    wechat = "https://img.hulatu.com/post/wechat.webp"
    alipay = "https://img.hulatu.com/post/zhifubao.webp"
    url = ""
    urlLabel = "去爱发电支持我"

  # 文章底部关注公众号引导：填图片地址即启用
  [params.wechat]
    name = "公众号：胡拉图说"
    desc = "运动、健康、工具与生活"
    qr = "https://img.hulatu.com/post/VMIet5.webp"
    followImg = "https://img.hulatu.com/post/VAZcJj.webp"

[params.assets]
  favicon = "/logo.svg"
  apple_touch_icon = "/apple-touch-icon.png"
  safari_pinned_tab = "/logo.svg"
   
[params.giscus]
  enabled = true
  repo = "hulatu/hulatu"
  repoId = "R_kgDOTApIwg"
  category = "Announcements"
  categoryId = "DIC_kwDOTApIws4DCXd5"
  mapping = "pathname"
  strict = false
  reactions = true
  emitMetadata = false
  inputPosition = "bottom"
  lang = "zh-CN"
  theme = "preferred_color_scheme"


# 首页额外输出 SearchIndex（用于 Fuse.js 客户端搜索）
[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

# 轻量文章索引（首页随机按钮使用，仅点击时拉取）
[outputFormats.PostIndex]
  mediaType = "application/json"
  baseName = "post-index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "SearchIndex", "PostIndex"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6
  [markup.highlight]
    noClasses = false     

[menu]
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 1
  [[menu.main]]
    name = "归档"
    url = "/archive/"
    weight = 2
  [[menu.main]]
    name = "分类"
    url = "/categories/"
    weight = 3
  # 系列（/series/）、工具（/tools/）刻意不放在导航栏，改到页脚图标区：layouts/partials/footer.html
  [[menu.main]]
    name = "周刊"
    url = "/weekly/"
    weight = 5
  [[menu.main]]
    name = "留言"
    url = "/guestbook/"
    weight = 10

[taxonomies]
  category = "categories"
  tag = "tags"

# 隐私友好的轻量统计，目前只使用 Umami
# umami 填脚本地址，umamiId 填站点 ID
[params.analytics]
  umami = "https://cloud.umami.is/script.js"
  umamiId = "b191cc39-861f-43c0-b750-b1e090fa9472"
