# ============================================================================
#  胡拉图说 —— 站点配置
#
#  2026-10-10 晚：整站从「自建主题」换成上游 hugo-bearneo（用户在 ~/bearneo-trial
#  上试运行过一整轮，这次是把它正式搬过来）。主题文件在 themes/hugo-bearneo/，
#  **逐字节未改**；所有本站特有的东西都在站点层（layouts/ + 本文件 + content/）。
#
#  想改主题行为：优先加站点层覆盖（layouts/ 下的同名文件），别改 themes/ 里的文件，
#  否则下次同步上游要重新对一遍。
# ============================================================================

baseURL = "https://hulatu.com/"
theme = "hugo-bearneo"
title = "胡拉图说"
# 0.158 起 languageCode 已弃用，改用 locale。
# ⚠️ 主题的 baseof.html 用的是 .Site.Language.Locale（站点层覆盖过，见 layouts/_default/baseof.html）。
locale = "zh-CN"
# 中文按「字」而不是「空格分词」计数 —— 影响 .Summary 截断与 .WordCount。
hasCJKLanguage = true
enableRobotsTXT = true

# ⚠️ 这一行必须待在**任何 `[table]` 之前** —— 写在后面会被并进那张表，
#    Hugo 只吐一句 `WARN Unknown kind "disablekinds"` 然后静默失效。
#
# 关掉 taxonomy **列表页**（/categories/、/tags/）。理由：上游没有 taxonomy 模板，
# 这两页会掉进 list.html 被当成一次「筛选」渲染，标题写「筛选：分类」、正文把全站文章
# 再列一遍。只关列表页 —— `/tags/xxx/` 词条页是 kind "term"，**仍然生成**，
# 所以文章下方那排 #标签 链接照常能用。
disableKinds = ["taxonomy"]

# 沿用原站 URL 结构，外链与搜索引擎收录一条都不变。
# posts 与 weekly 都落在 /posts/YYYY/MM/DD/slug/（周刊也在这条路径下，是刻意的）。
[permalinks]
  posts = "/posts/:year/:month/:day/:slug/"
  weekly = "/posts/:year/:month/:day/:slug/"

[params]
  title = "胡拉图说"
  description = "胡拉图说：一个普通研究生的个人博客，喜欢记录思考、分享日常、观察生活，内容包含但不限于运动、健康、成长、科研与工具折腾。"

  # 主题的 favicon 参数（主题里默认是 img/favicon.png，这里指到 static 根下的 svg）
  favicon = "favicon.svg"

  # RSS <image> 用的站点图标（layouts/_default/rss.xml 读它）。
  # ⚠️ 必须是 **PNG 光栅图**，且尺寸与模板里写死的 144×144 一致：
  #    阅读器的图标管线基本不吃 SVG，指向 favicon.svg 等于没写这一段。
  # ⚠️ 这张图由 static/favicon.svg 生成（白底，理由见 DESIGN.md 第 12 节），
  #    换图标时重跑那条命令，别手工裁一张。
  feedIcon = "images/feed-icon.png"
  images = ["images/share.webp"]

  # og:image / twitter:image 的宽高（share.webp 实测 1200×630，lossless VP8）。
  # Hugo 内置的 opengraph 模板只输出 URL；补上宽高，社交平台不用先把图抓下来
  # 就能定卡片比例（分享时省一次往返 + 少一帧空白）。
  # 输出位置：layouts/partials/seo_tags.html（上游模板没有这一段）。
  # ⚠️ 换分享图要**同步改这两行** —— 写错不会报错，只会让社交卡片比例算错。
  ogImageWidth = 1200
  ogImageHeight = 630

  # 页脚版权行。上游模板是 `{{ .Site.Params.copyright }}` 原样输出，
  # ⚠️ Go 的 html/template 会转义 `&` —— 所以必须写**字面量 ©**，
  #    写成 `&copy;` 会被转义成 `&amp;copy;`，页面上原样显示成 "&copy;" 这六个字符。
  copyright = "Copyright © 2025-2026, hulatu."

  # 页脚最后一行：授权声明 + 隐私 + 🗺️ Sitemap。
  # 2026-10-11 用户要求：这一行**全英文**，并且「CC BY-NC-SA 4.0」要带链接。
  # 上游把版权和 Sitemap 挤在同一行，为了拆成两行，站点层覆盖了 partials/footer.html，
  # 在版权行后补了一个 `<br />`；这段授权声明就从 copyright 里拆出来放到这里。
  # ⚠️ copyrightNote 走的是 `{{ . }}` **文本输出**，写 Markdown 链接不会生效 ——
  #    所以 CC 那一段拆成「链接前的文字 / 链接文字 / 链接地址」三个参数。
  #    任意一段留空就少一段，最后一行只剩「Privacy · 🗺️ Sitemap.」。
  copyrightNote = "This site is licensed under"
  licenseName = "CC BY-NC-SA 4.0"
  licenseURL = "https://creativecommons.org/licenses/by-nc-sa/4.0/"

  # 日期格式：主题默认 "02 Jan."（英文月份缩写），中文站改成 ISO。
  dateFormat = "2006-01-02"

  # 三个 Bear Blog 风格开关（主题自带）
  groupByYear = true      # 列表页按年份分组，年份用 <h3> 当小标题
  showPostCount = true    # 列表页顶部显示「共 N 篇。」
  postSearch = true       # 列表页顶部一个输入框，纯前端按标题过滤（不是全站搜索面板）

  # 文章页能力
  toc = true              # 右侧固定目录。显示断点在站点层 custom_head.html 第 20 段
                          # （2026-10-12 由主题原生的 800px 抬到 1200px）。
  imageZoom = true        # 点正文图片全屏放大（纯 CSS，checkbox + label）
  externalLinksNewTab = true

  # 首页「最近更新」列表的条数（参考站 yinji.org 的 Recent Posts）。
  # 设 0 就不显示列表，首页退回上游原样（只有站名 + 一句话）。
  homeRecentCount = 5


  [params.footer]
    hideCopyright = false
    hideSitemap = false
    hideMadeWithLine = false
    hideRSSAndEmail = false

  [params.RSS]
    enableRSS = true
    pageLimit = 20

  [params.author]
    name = "胡拉图"
    email = "hello@hulatu.com"

  # 评论区：giscus（GitHub Discussions）。
  # 上游主题没有评论区，接入点在站点层的 single.html + partials/giscus.html。
  # ⚠️ mapping = "pathname" 意味着「同一个 URL 认作同一条讨论」。
  #    本站 URL 由上面的 [permalinks] 生成，和改版前逐字一致，所以**老评论能直接接上**。
  [params.giscus]
    enabled = true
    repo = "hulatu/hulatu"
    repoId = "R_kgDOTApIwg"
    category = "Announcements"
    categoryId = "DIC_kwDOTApIws4DCXd5"
    mapping = "pathname"
    strict = false
    reactions = true
    emitMetadata = false
    inputPosition = "bottom"
    lang = "zh-CN"
    theme = "preferred_color_scheme"

  # 隐私友好的轻量统计：只使用 GoatCounter。
  # 上游 baseof.html 里没有统计的挂载点，所以这段是站点层在 custom_head.html 里补的。
  [params.analytics]
    goatcounter = "https://hulatu.goatcounter.com/count"

# ============================================================================
#  导航 —— **全部**由这张表驱动。
#  站点层覆盖的 partials/nav.html 只渲染这张表，不像上游那样把 `Home` / `Blog`
#  写死在模板里；顺序由 weight 决定，与下面的书写顺序无关。
#
#  2026-10-10 晚按用户要求改成 BearNeo 样式的英文标签（页面正文仍是中文）：
#      Home / About / Now / Links / Weekly / Posts / RSS
#  2026-10-11 晚按用户要求新增 Hub（个人主页 https://profile.hulatu.com/），插在 Home 右侧；
#  2026-10-12 又按用户要求**撤掉** —— 子站不再从导航进入，入口统一收到 `/about/`
#      （见 content/about.md）。
#  ⚠️ 2026-10-12 晚：**四个子站全部下线**（run / shot / share / profile）。
#      profile 的内容并入 `/about/`；跑步页并入本站 `/run/`；shot / share 本就是空壳。
#      仓库里的 `sites/` 目录、`scripts/build-subdomains.sh`、以及子站导航配置**已整体删除**，
#      所以「子站导航带不带 Hub」这类问题已经不存在了。
#
#  ⚠️ Links 指向 /roll/（**收藏 + 友链**，2026-10-11 起两页并成一页），不是 /friends/。
#     原友链页 /links/ 已删除，旧地址 301 到 /roll/（见 static/_redirects）。
#  ⚠️ Posts 指向 /archive/（全部文章，倒序列出）。
#  ⚠️ Weekly（/weekly/）2026-10-11 按用户要求补回主导航，插在 Posts **左边**
#     （靠 weight 45 卡位，顺序与下面书写的先后无关）。
#     分类（/categories/）仍然没有入口 —— 列表页已被上面的 disableKinds 关掉，
#     只剩文章下方的 #标签 词条页。
#  ⚠️ RSS（2026-10-11 用户要求「导航栏最右侧加一个 RSS 订阅，就是我全站的内容」）
#     → 指向 **`/index.xml`**，即首页那路 RSS（全站内容）。weight 60 让它排最右。
#     ⚠️ 地址与页脚那行 `Subscribe via RSS` 用的是**同一个** `href="/index.xml"`，
#        改这里要回去看 `layouts/partials/footer.html`。
#     ⚠️ `/index.xml` 不是 http(s) 开头，所以 `externalLinksNewTab` 那套
#        不会给它加 `target="_blank"` —— 与页脚那个 RSS 链接行为一致（原地打开）。
#     ⚠️ 它**不是一条普通导航项**：不需要「当前页高亮」的概念（feed 不是页面）。
#        导航高亮由 nav.html 决定，目前没有做高亮逻辑，所以无需特殊处理。
# ============================================================================
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 10

# 2026-10-12 撤掉 Hub（个人主页子站入口）—— 理由见上面「导航」那段注释：
#     子站入口现在只出现在 `/about/`。⚠️ 同日稍后四个子站整体下线，`sites/` 已删。
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 20

[[menu.main]]
  name = "Now"
  url = "/now/"
  weight = 30

[[menu.main]]
  name = "Links"
  url = "/roll/"
  weight = 40

# 2026-10-11 新增：周刊回到导航，位置在 Posts 左边（weight 卡在 40 和 50 之间）。
[[menu.main]]
  name = "Weekly"
  url = "/weekly/"
  weight = 45

[[menu.main]]
  name = "Posts"
  url = "/archive/"
  weight = 50

# 2026-10-11 用户要求：**导航最右侧**一个 RSS 订阅入口，指向全站内容的 feed。
# 见上面「导航」那段注释里的三条 ⚠️（地址与页脚同源、不新开窗口、不需要高亮）。
[[menu.main]]
  name = "RSS"
  url = "/index.xml"
  weight = 60

# 文章里嵌了腾讯视频的裸 <iframe>，Goldmark 默认会把它们丢掉并吐 WARN。
[markup.goldmark.renderer]
  unsafe = true

# ============================================================================
#  代码高亮（2026-10-11 修：这一块以前是**看不见的**）
#
#  noClasses = false → 让 Chroma 输出 `class="kn"` 这样的短类名，
#  **而不是把颜色写成内联 style**。这是本站唯一能修好代码块配色的开关，
#  原因见下（不能靠改 CSS 解决）。
#
#  ── 为什么必须改成 false ────────────────────────────────────────────
#  默认值是 true（内联样式）。而主题 style.html 里有两条：
#      code            { background-color: var(--bg-color-secondary) }
#      div.highlight code { background-color: var(--bg-color-secondary) }
#  它们把代码块的底色改成了**浅色**（#f2f4f7），
#  但 Chroma 内联写的却是 **深色主题 monokai** 的前景色：
#      <pre style="color:#f8f8f2;background-color:#272822">
#  内联的 `pre` 背景被 `code` 的浅色背景盖住了（code 铺满 pre），
#  于是实际渲染成「浅灰底 + 深色主题的字色」——
#  实测截图采样：底 #f2f4f7，普通标识符 #f8f8f2、字符串 #e6db74，对比度约 **1.05:1 / 1.15:1**，
#  **等于看不见**（关键词 #f92672 品红还勉强能读，所以看着像「只有一半能看清」）。
#
#  内联 style 的优先级高于任何 CSS（除非用 !important），
#  所以**光改 CSS 修不了** —— 必须让 Chroma 别再写内联色。
#
#  改成 false 之后：Chroma 只输出类名，配色由站点层
#  `layouts/partials/custom_head.html` 第 12 段提供，
#  浅色 / 深色两套都跟随 `prefers-color-scheme`。
#
#  ⚠️ 改回 true 会让代码块重新变成「看不见」，别改。
#  ⚠️ 样式表在站点层，不在 themes/ 里 —— 改配色去 custom_head.html 第 12 段。
# ============================================================================
[markup.highlight]
  noClasses = false

# 目录只收 h2 / h3 两级：文章里的 h4 多为「小注」，收进来会让右栏变长。
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

# 上游 exampleSite 是直接把 taxonomy 关掉，所以它没暴露这个问题：
# 一旦开着 taxonomy，Hugo 会给**每一个词条**发一份 RSS —— 本站 187 个标签 + 8 个分类
# 会直接多出 140 个 .xml。这几行把它们压回 HTML-only，
# 只有首页主源和周刊（content/weekly/_index.md 里单独开了 outputs）出 feed。
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[services.rss]
  # 每个 feed 输出的条目上限。全文输出，条数放大反而拖慢订阅端。
  limit = 20

[taxonomies]
  category = "categories"
  tag = "tags"

[minify]
  disableXML = true
  minifyOutput = true

# 版本约束：本机、GitHub Actions 和 Cloudflare Pages 三边用同一个版本，避免
# 「本地构建正常、平台构建失败」这种只有上线才发现的问题。
#
# ⚠️ `extended = true` 是**历史遗留**：自建主题时代 `head-meta.html` 用 imageConfig
#    读分享图的宽高，非 extended 版解不了 WebP。2026-10-10 迁移到上游 hugo-bearneo 后，
#    全仓库（主题 + 站点层 + scripts/）已经**没有任何 imageConfig 调用**，
#    标准版理论上也能构建。但保持 extended 是零成本的，而且省得去改 Cloudflare 项目 ——
#    所以**先留着**，别为了「顺手删掉」去动 CI 和平台配置。
# 改这里时记得同步 .github/workflows/build.yml、README / MAINTENANCE 里写的版本号，
# 以及 Cloudflare 项目的 HUGO_VERSION。
[module]
  [module.hugoVersion]
    min = "0.167.0"
    extended = true
