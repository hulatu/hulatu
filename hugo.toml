baseURL = "https://hulatu.com/"
locale = "zh-CN"
title = "胡拉图说"
hasCJKLanguage = true
enableRobotsTXT = true
copyright = "本站内容采用 CC BY-NC-SA 4.0 协议"

[pagination]
  pagerSize = 10

[services.rss]
  # 每个 feed 输出的条目上限（-1 表示不限制）。全文输出，条数放大反而拖慢订阅端
  limit = 20

[related]
  threshold = 60
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
  
[imaging]
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 75
  [imaging.webp]
    quality = 75
  [imaging.avif]
    quality = 75
  
[minify]
  disableXML = true
  minifyOutput = true
  
[permalinks]
  posts = "/posts/:year/:month/:day/:slug/"
  weekly = "/posts/:year/:month/:day/:slug/"

[params]
  description = "胡拉图说：一个普通研究生的个人博客，喜欢记录思考、分享日常、观察生活，内容包含但不限于运动、健康、成长、科研与工具折腾。"
  author = "胡拉图"
  since = "2025"
  github = "https://github.com/hulatu"
  email = "hello@hulatu.com"
  avatar = "/images/avatar.webp"

  # 自有图片 CDN：正文图片通过 Cloudflare Image Transformations 动态压缩
  [params.imageCDN]
    host = "img.hulatu.com"

  # 打赏：把微信/支付宝赞赏码图片放进 static/img/ 并填好路径；
  # 或用第三方平台（如爱发电）填 url。全部留空时页面不显示。
  [params.donate]
    enabled = true
    hint = "如果这篇文章对你有帮助，请我喝杯咖啡吧"
    button = "打赏支持"
    wechat = "https://img.hulatu.com/post/wechat.webp"
    alipay = "https://img.hulatu.com/post/zhifubao.webp"
    url = ""
    urlLabel = "去爱发电支持我"

[params.assets]
  # 页头那个大 logo（深色模式下由 CSS 的 filter 反白）
  logo = "/logo.svg"
  # 标签页图标：内置了 prefers-color-scheme 深色适配，和页头 logo 是两个文件，
  # 别混用——favicon 里的反白规则会和页头的 filter 叠加，变成反色
  favicon = "/favicon.svg"
  apple_touch_icon = "/apple-touch-icon.png"
  safari_pinned_tab = "/logo.svg"
  shareImage = "/images/share.webp"
   
[params.giscus]
  enabled = true
  repo = "hulatu/hulatu"
  repoId = "R_kgDOTApIwg"
  category = "Announcements"
  categoryId = "DIC_kwDOTApIws4DCXd5"
  mapping = "pathname"
  strict = false
  reactions = true
  emitMetadata = false
  inputPosition = "bottom"
  lang = "zh-CN"
  theme = "preferred_color_scheme"

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]
  # 栏目默认不出 RSS：只有首页主源（/index.xml）和周刊（content/weekly/_index.md 单独开）
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6
  [markup.highlight]
    noClasses = false     

[menu]
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 1
  [[menu.main]]
    name = "归档"
    url = "/archive/"
    weight = 2
  [[menu.main]]
    name = "分类"
    url = "/categories/"
    weight = 4
  [[menu.main]]
    name = "周刊"
    url = "/weekly/"
    weight = 3

[taxonomies]
  category = "categories"
  tag = "tags"

# 隐私友好的轻量统计：只使用 GoatCounter
# goatcounter 填 GoatCounter 后台 Site code 里的完整计数地址
[params.analytics]
  goatcounter = "https://hulatu.goatcounter.com/count"
