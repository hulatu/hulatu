name: 同步 Garmin 跑步数据

on:
  workflow_dispatch:
  schedule:
    # 每天 22:00（Asia/Taipei）= 14:00 UTC
    - cron: "0 14 * * *"

permissions:
  contents: write

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install --upgrade garminconnect

      - name: 拉取最新跑步记录
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_MFA_CODE: ${{ secrets.GARMIN_MFA_CODE }}
          GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
          GARMIN_REGION: ${{ secrets.GARMIN_REGION }}
        run: python3 scripts/sync-garmin.py

      - name: 提交数据变更
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto Update: 同步 Garmin 跑步数据"
          # 脚本只写这一个文件。⚠️ 2026-10-12 前这里还带
          # `sites/profile/data/run_summary.json`（profile 子站首页那块跑步摘要），
          # 那个子站已整体删除，文件不存在 —— 留着会让 git-auto-commit 报错。
          # 主站 `/run/` 页与子站一样直接读根目录的 `data/runs.json`，从来没有副本。
          file_pattern: data/runs.json
