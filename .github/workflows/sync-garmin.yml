name: 同步 Garmin 跑步数据

on:
  schedule:
    # 每 24 小时检查一次新记录（每天晚上 10 点）
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install --upgrade garminconnect

      - name: 拉取最新跑步记录
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_MFA_CODE: ${{ secrets.GARMIN_MFA_CODE }}
          GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
          GARMIN_REGION: ${{ secrets.GARMIN_REGION }}
        run: python3 scripts/sync-garmin.py

      - name: 提交数据变更
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto Update: 同步 Garmin 跑步数据"
          file_pattern: data/runs.json
